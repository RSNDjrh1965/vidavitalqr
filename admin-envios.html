<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidaVitalQR — Etiquetas de envío (panel privado)</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --navy:#0F2A3D; --navy-light:#1B4863; --paper:#F7F5F0; --card:#FFFFFF;
    --red:#C1272D; --teal:#2E7D6B; --slate:#5B6774; --line:#DDD8CC; --amber:#E2A63B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); font-family:'Source Sans Pro',Arial,sans-serif; color:var(--navy); padding:32px 16px 80px; }
  .wrap{ max-width:640px; margin:0 auto; }
  h1{ font-family:'Libre Franklin',Arial,sans-serif; font-size:1.4rem; margin-bottom:6px; }
  p.sub{ color:var(--slate); margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; margin-top:20px; }
  label{ display:block; font-size:0.85rem; font-weight:600; color:var(--navy-light); margin-bottom:5px; }
  input{ width:100%; font-size:0.95rem; padding:10px 12px; border:1.4px solid var(--line); border-radius:8px; margin-bottom:14px; font-family:inherit; }
  button{ font-family:'Libre Franklin',Arial,sans-serif; font-weight:600; font-size:0.92rem; padding:11px 20px; border-radius:8px; border:none; cursor:pointer; background:var(--teal); color:#fff; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  #msg{ font-size:0.85rem; margin-top:10px; }
  #msg.error{ color:var(--red); }
  #msg.ok{ color:var(--teal); }

  /* ---- etiqueta de envío, tamaño 3in x 2in (76.2mm x 50.8mm) — tamaño real de la
        impresora de etiquetas del usuario, confirmado el 2026-09-18 (antes se usaba el
        tamaño de una tarjeta de crédito estándar, 85.6mm x 54mm, ligeramente más grande) ---- */
  #etiquetaWrap{ display:none; margin-top:24px; }
  /* ---- corrección definitiva del bug de "3 páginas al imprimir" (2026-09-18): en vez de
        intentar que SOLO la etiqueta sea visible dentro de esta misma página (varias
        combinaciones de visibility/display/flex/absolute/page-break se probaron y ninguna
        evitó que Chromium generara una página extra en blanco), "Imprimir etiqueta" ahora
        abre una ventana nueva que contiene ÚNICAMENTE el HTML de la etiqueta — así no hay
        ningún otro elemento de esta página (encabezado, buscador, botones) que Chromium
        pueda intentar paginar. Ver función imprimirEtiqueta() más abajo. Estas reglas de
        @media print se dejan como respaldo por si el usuario imprime desde esta página
        directamente (Ctrl+P) en vez de usar el botón. ---- */
  .etiqueta{
    width:76.2mm; height:50.8mm; box-sizing:border-box; overflow:hidden;
    border:1.2mm dashed #999; border-radius:3mm;
    font-family:Arial,Helvetica,sans-serif; color:#1a1a1a;
    position:relative; background:#fff;
    margin:0.5mm auto;
  }
  /* ---- corrección 2026-09-18 (b): la etiqueta se imprime en blanco y negro, así que la
        cabecera de color sólida se ve como un bloque gris/negro sin contraste en esa
        impresora — se cambió a fondo blanco con solo una línea inferior de separación, sin
        ningún relleno oscuro ni sombra. Se agregó también el sitio web como referencia. ---- */
  .etiqueta .et-header{
    background:#fff; color:#111; padding:2mm 4mm;
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:0.4mm solid #111;
  }
  .etiqueta .et-brand{ font-size:8pt; font-weight:700; display:flex; align-items:center; gap:1.5mm; letter-spacing:0.2px; }
  .etiqueta .et-brand .dot{ width:2mm; height:2mm; border-radius:50%; background:#111; display:inline-block; }
  .etiqueta .folio{ font-size:6.5pt; font-weight:600; color:#444; }
  .etiqueta .et-body{ padding:2mm 4mm 0; }
  .etiqueta .bloque-inferior{ position:absolute; left:4mm; right:4mm; bottom:2.5mm; }
  .etiqueta .nombre{ font-size:11pt; font-weight:700; margin-top:0.3mm; color:#111; }
  .etiqueta .direccion{ font-size:9pt; line-height:1.3; margin-top:1.2mm; color:#222; }
  .etiqueta .telefono{ font-size:9pt; font-weight:700; color:#111; }
  .etiqueta .footer-note{ font-size:5.5pt; color:#555; margin-top:0.8mm; border-top:0.3mm solid #999; padding-top:0.8mm; }
  .etiqueta .footer-web{ font-size:5.5pt; color:#555; font-weight:600; margin-top:0.3mm; }

  /* ---- botón de descarga como imagen (alternativa a "Imprimir etiqueta", para quien
        prefiera cargar el PNG directamente en el software de su impresora de etiquetas en
        vez de depender del diálogo de impresión del navegador) ---- */
  .accion-secundaria{ background:var(--navy-light); }

  /* ---- corrección 2026-09-18: la regla anterior (visibility:hidden en todo <body>) dejaba
        el espacio en blanco de los elementos ocultos ocupando su lugar en la página, y el
        botón "Imprimir etiqueta"/"Descargar..." (dentro de #etiquetaWrap) también se volvía
        visible junto con la etiqueta — por eso salían 3 páginas en vez de una sola con solo
        la etiqueta. Ahora se usa display:none (que sí retira el espacio) sobre una clase
        explícita ".no-print", y esa clase se le puso al encabezado, al recuadro de búsqueda
        y a la fila de botones — nunca a la etiqueta misma. ---- */
  @media print{
    html, body{ margin:0 !important; padding:0 !important; background:#fff !important; }
    .no-print{ display:none !important; }
    #etiquetaWrap{ display:block !important; margin:0 !important; }
    #etiquetaWrap > .card{ padding:0 !important; }
    /* la página se deja 1mm más grande que la etiqueta en cada dimensión (margen de
       tolerancia): al hacerla del tamaño EXACTO de la etiqueta, el redondeo de los bordes
       redondeados/el borde punteado empujaba un pixel de sobra a una segunda página en
       blanco — visto y corregido el 2026-09-18 generando el PDF de prueba y contando sus
       páginas realmente resultantes, no solo revisando el CSS. */
    .etiqueta{ margin:0.5mm auto; }
    @page{ size:77.2mm 51.8mm; margin:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="no-print">Etiquetas de envío</h1>
  <p class="sub no-print">Panel privado — consulte la dirección de envío guardada por folio e imprima la etiqueta, o descárguela como imagen para su impresora de etiquetas (3in x 2in).</p>

  <div class="card no-print">
    <label for="pwInput">Contraseña de administración</label>
    <input type="password" id="pwInput" autocomplete="current-password">
    <label for="folioInput">Folio de la ficha</label>
    <input type="text" id="folioInput" placeholder="Ej. VVITALQR-000123">
    <button id="buscarBtn">Buscar dirección de envío</button>
    <div id="msg"></div>
  </div>

  <div id="etiquetaWrap">
    <div class="card" style="background:transparent; border:none; padding:0;">
      <div class="etiqueta" id="etiqueta">
        <div class="et-header">
          <div class="et-brand"><span class="dot"></span>VidaVitalQR — Envío</div>
          <div class="folio" id="etFolio"></div>
        </div>
        <div class="et-body">
          <div class="nombre" id="etNombre"></div>
          <div class="direccion" id="etDireccion"></div>
        </div>
        <div class="bloque-inferior">
          <div class="telefono" id="etTelefono"></div>
          <div class="footer-note">Dirección de envío registrada por el titular de esta ficha — VidaVitalQR</div>
          <div class="footer-web">www.vidavitalqr.com</div>
        </div>
      </div>
    </div>
    <div class="no-print" style="text-align:center; margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button id="imprimirBtn">Imprimir etiqueta</button>
      <button id="descargarBtn" class="accion-secundaria">Descargar como imagen (PNG)</button>
    </div>
    <p class="no-print" id="descargaMsg" style="font-size:0.8rem; color:var(--slate); text-align:center; margin-top:8px;"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  var pwInput = document.getElementById('pwInput');
  var folioInput = document.getElementById('folioInput');
  var buscarBtn = document.getElementById('buscarBtn');
  var msg = document.getElementById('msg');
  var etiquetaWrap = document.getElementById('etiquetaWrap');
  var imprimirBtn = document.getElementById('imprimirBtn');
  var descargarBtn = document.getElementById('descargarBtn');
  var descargaMsg = document.getElementById('descargaMsg');
  var etiquetaEl = document.getElementById('etiqueta');
  var folioActual = '';

  function tipoDeFolio(folio){
    var f = (folio || '').toUpperCase();
    if (f.indexOf('VVMASCOTA') === 0) return 'mascota';
    if (f.indexOf('VVOBJETO') === 0) return 'objeto';
    return 'persona';
  }

  buscarBtn.addEventListener('click', function(){
    var pw = pwInput.value;
    var folio = folioInput.value.trim();
    msg.className = '';
    msg.textContent = '';
    etiquetaWrap.style.display = 'none';

    if (!pw) { msg.className = 'error'; msg.textContent = 'Ingrese la contraseña.'; return; }
    if (!folio) { msg.className = 'error'; msg.textContent = 'Ingrese el folio.'; folioInput.focus(); return; }

    buscarBtn.disabled = true;
    buscarBtn.textContent = 'Buscando…';

    fetch('/.netlify/functions/obtener-envio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, folio: folio, tipo: tipoDeFolio(folio) })
    })
      .then(function(resp){ return resp.json().then(function(json){ return { ok: resp.ok, json: json }; }); })
      .then(function(result){
        if (!result.ok) throw new Error((result.json && result.json.error) || 'No se pudo consultar la dirección.');
        var datos = result.json;
        folioActual = datos.folio || folio;
        document.getElementById('etFolio').textContent = 'Folio ' + folioActual;
        document.getElementById('etNombre').textContent = datos.nombreEnvio || '';
        document.getElementById('etDireccion').innerHTML =
          'Provincia: ' + (datos.provincia || '') + ' &middot; Cantón: ' + (datos.canton || '') + ' &middot; Distrito: ' + (datos.distrito || '') +
          (datos.senas ? '<br>Otras señas: ' + datos.senas : '');
        document.getElementById('etTelefono').textContent = 'Tel: ' + (datos.telefono || '');
        etiquetaWrap.style.display = 'block';
        descargaMsg.textContent = '';
        msg.className = 'ok';
        msg.textContent = 'Dirección encontrada.';
      })
      .catch(function(err){
        msg.className = 'error';
        msg.textContent = err.message || 'No se pudo consultar la dirección.';
      })
      .finally(function(){
        buscarBtn.disabled = false;
        buscarBtn.textContent = 'Buscar dirección de envío';
      });
  });

  // ---- "Imprimir etiqueta": en vez de imprimir esta misma página (donde Chromium
  //      insistía en generar una página extra en blanco sin importar qué reglas CSS se
  //      probaran), se abre una ventana nueva que contiene ÚNICAMENTE el HTML de la
  //      etiqueta con sus propios estilos — así no queda ningún otro elemento de la página
  //      que el navegador pueda paginar de más (2026-09-18). ----
  imprimirBtn.addEventListener('click', function(){
    var estilosEtiqueta =
      '*{box-sizing:border-box;margin:0;padding:0;}' +
      'html,body{background:#fff;}' +
      '@page{ size:76.2mm 50.8mm; margin:0; }' +
      '.etiqueta{ width:76.2mm; height:50.8mm; overflow:hidden; border:1.2mm dashed #999; border-radius:3mm; font-family:Arial,Helvetica,sans-serif; color:#1a1a1a; position:relative; background:#fff; }' +
      '.etiqueta .et-header{ background:#fff; color:#111; padding:2mm 4mm; display:flex; justify-content:space-between; align-items:center; border-bottom:0.4mm solid #111; }' +
      '.etiqueta .et-brand{ font-size:8pt; font-weight:700; display:flex; align-items:center; gap:1.5mm; letter-spacing:0.2px; }' +
      '.etiqueta .et-brand .dot{ width:2mm; height:2mm; border-radius:50%; background:#111; display:inline-block; }' +
      '.etiqueta .folio{ font-size:6.5pt; font-weight:600; color:#444; }' +
      '.etiqueta .et-body{ padding:2mm 4mm 0; }' +
      '.etiqueta .bloque-inferior{ position:absolute; left:4mm; right:4mm; bottom:2.5mm; }' +
      '.etiqueta .nombre{ font-size:11pt; font-weight:700; margin-top:0.3mm; color:#111; }' +
      '.etiqueta .direccion{ font-size:9pt; line-height:1.3; margin-top:1.2mm; color:#222; }' +
      '.etiqueta .telefono{ font-size:9pt; font-weight:700; color:#111; }' +
      '.etiqueta .footer-note{ font-size:5.5pt; color:#555; margin-top:0.8mm; border-top:0.3mm solid #999; padding-top:0.8mm; }' +
      '.etiqueta .footer-web{ font-size:5.5pt; color:#555; font-weight:600; margin-top:0.3mm; }';

    var ventana = window.open('', '_blank', 'width=420,height=320');
    if (!ventana) {
      alert('El navegador bloqueó la ventana de impresión. Permita ventanas emergentes para este sitio e intente de nuevo.');
      return;
    }
    var doc = ventana.document;
    doc.open();
    doc.write(
      '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Etiqueta de envío</title>' +
      '<style>' + estilosEtiqueta + '</style></head><body>' + etiquetaEl.outerHTML + '</body></html>'
    );
    doc.close();

    var yaImprimio = false;
    function imprimirYCerrar(){
      if (yaImprimio) return;
      yaImprimio = true;
      ventana.focus();
      ventana.print();
      setTimeout(function(){ try { ventana.close(); } catch (e) {} }, 300);
    }
    ventana.onload = imprimirYCerrar;
    setTimeout(imprimirYCerrar, 400); // respaldo si onload no dispara en algún navegador
  });

  // ---- descarga de la etiqueta como imagen PNG, para quien prefiera cargarla directamente
  //      en el software de su propia impresora de etiquetas (3in x 2in / 76.2mm x 50.8mm)
  //      en vez de depender del diálogo de impresión del navegador (2026-09-18) ----
  if (descargarBtn && window.html2canvas) {
    descargarBtn.addEventListener('click', function(){
      var textoOriginal = descargarBtn.textContent;
      descargarBtn.disabled = true;
      descargarBtn.textContent = 'Generando imagen…';
      descargaMsg.textContent = '';

      // 300 DPI sobre 3in x 2in (900 x 600 px) — nítida para la mayoría de impresoras de
      // etiquetas; el navegador renderiza el elemento a ~96 DPI, así que se escala el
      // factor necesario para llegar a 300 DPI reales en el PNG final.
      var DPI_OBJETIVO = 300;
      var escala = DPI_OBJETIVO / 96;

      html2canvas(etiquetaEl, { scale: escala, backgroundColor: '#ffffff', useCORS: true })
        .then(function(canvas){
          var enlace = document.createElement('a');
          var nombreArchivo = 'etiqueta-envio-' + (folioActual || 'vidavitalqr') + '.png';
          enlace.download = nombreArchivo;
          enlace.href = canvas.toDataURL('image/png');
          document.body.appendChild(enlace);
          enlace.click();
          document.body.removeChild(enlace);
          descargaMsg.textContent = 'Imagen descargada (' + canvas.width + ' x ' + canvas.height + ' px, 3in x 2in a 300 DPI).';
        })
        .catch(function(err){
          console.error('Error generando la imagen de la etiqueta:', err);
          descargaMsg.textContent = 'No se pudo generar la imagen. Intente de nuevo.';
        })
        .finally(function(){
          descargarBtn.disabled = false;
          descargarBtn.textContent = textoOriginal;
        });
    });
  }
})();
</script>
</body>
</html>
