<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Opiniones pendientes — VidaVitalQR</title>
<style>
  :root{
    --ink:#12282B;
    --paper:#F7F4EE;
    --card:#FFFFFF;
    --teal-deep:#1F4448;
    --line:#DAD3C4;
    --muted:#6C7A76;
    --signal:#C1552F;
    --ok:#2E7D4F;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:"Source Sans 3", Arial, Helvetica, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:28px 16px;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  h1{ font-family:Georgia, "Times New Roman", serif; font-size:1.7rem; margin:0 0 4px; }
  .sub{ color:var(--muted); margin-top:0; margin-bottom:24px; font-size:0.95rem; }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  label{ display:block; font-size:0.85rem; color:var(--muted); margin-bottom:6px; }
  input[type=password]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:1rem;
    margin-bottom:14px;
    font-family:inherit;
  }
  button{
    font-family:inherit;
    font-weight:600;
    font-size:0.92rem;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
  button:disabled{ opacity:0.55; cursor:default; }
  .btn-primary{ background:var(--teal-deep); color:var(--paper); }
  .btn-approve{ background:var(--ok); color:#fff; margin-right:8px; }
  .btn-reject{ background:var(--signal); color:#fff; }
  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .toolbar button{ padding:8px 14px; font-size:0.85rem; }
  .msg{ font-size:0.88rem; margin:10px 0 0; }
  .msg.err{ color:var(--signal); }
  .msg.ok{ color:var(--ok); }
  .testi-name{ font-weight:700; font-size:1.02rem; }
  .testi-role{ font-size:0.85rem; color:var(--muted); margin-bottom:8px; }
  .testi-text{ margin:8px 0 14px; line-height:1.5; }
  .testi-fecha{ font-size:0.75rem; color:var(--muted); margin-top:12px; }
  .empty{ color:var(--muted); font-style:italic; }
  [hidden]{ display:none !important; }
  .langbar{ display:flex; justify-content:flex-end; gap:6px; margin-bottom:14px; }
  .langbar button{
    padding:5px 11px;
    font-size:0.78rem;
    font-weight:600;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card);
    color:var(--muted);
    cursor:pointer;
  }
  .langbar button.activo{ background:var(--teal-deep); border-color:var(--teal-deep); color:var(--paper); }
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar" id="langbar">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="pt">PT</button>
  </div>

  <h1 data-i18n="titulo">Opiniones pendientes</h1>
  <p class="sub" data-i18n="subtitulo">Panel privado para revisar y publicar las opiniones que llegan desde el formulario "Comparta su experiencia" de vidavitalqr.com. Aprobar o rechazar aquí no requiere volver a desplegar el sitio.</p>

  <div class="card" id="loginBox">
    <label for="pwInput" data-i18n="lblPassword">Contraseña de administración</label>
    <input type="password" id="pwInput" autocomplete="current-password">
    <button class="btn-primary" id="btnEntrar" data-i18n="btnVer">Ver opiniones pendientes</button>
    <p class="msg" id="loginMsg"></p>
  </div>

  <div id="listaBox" hidden>
    <div class="toolbar">
      <button class="btn-primary" id="btnRefrescar" data-i18n="btnActualizar">Actualizar lista</button>
    </div>
    <div id="listaContenido"></div>
  </div>
</div>

<script>
  // ---- textos del panel en los 4 idiomas del sitio (ES/EN/FR/PT) — punto 54 de la bitácora.
  // Este panel es de uso interno (solo lo usa el propio administrador, con contraseña, sin
  // enlace en el menú), pero el usuario pidió explícitamente que sí tuviera opción de idioma,
  // a diferencia de admin-envios.html. Las opiniones mismas (nombre, rol, texto que escribió la
  // persona) NUNCA se traducen — solo el texto de la interfaz de este panel. ----
  var TEXTOS_PANEL = {
    es: {
      titulo: 'Opiniones pendientes',
      subtitulo: 'Panel privado para revisar y publicar las opiniones que llegan desde el formulario "Comparta su experiencia" de vidavitalqr.com. Aprobar o rechazar aquí no requiere volver a desplegar el sitio.',
      lblPassword: 'Contraseña de administración',
      btnVer: 'Ver opiniones pendientes',
      btnActualizar: 'Actualizar lista',
      escribaPassword: 'Escriba la contraseña.',
      passwordIncorrecta: 'Contraseña incorrecta.',
      cargando: 'Cargando…',
      errorCargar: 'No se pudo cargar la lista. Intente de nuevo.',
      vacio: 'No hay opiniones pendientes por ahora.',
      btnAprobar: 'Aprobar y publicar',
      btnRechazar: 'Rechazar',
      publicando: 'Publicando…',
      rechazando: 'Rechazando…',
      publicada: 'Publicada en el sitio.',
      rechazada: 'Rechazada.',
      errorProcesar: 'No se pudo procesar. Intente de nuevo.',
    },
    en: {
      titulo: 'Pending testimonials',
      subtitulo: 'Private panel to review and publish the testimonials submitted through the "Share your experience" form on vidavitalqr.com. Approving or rejecting here does not require redeploying the site.',
      lblPassword: 'Admin password',
      btnVer: 'View pending testimonials',
      btnActualizar: 'Refresh list',
      escribaPassword: 'Enter the password.',
      passwordIncorrecta: 'Incorrect password.',
      cargando: 'Loading…',
      errorCargar: 'Could not load the list. Please try again.',
      vacio: 'There are no pending testimonials right now.',
      btnAprobar: 'Approve and publish',
      btnRechazar: 'Reject',
      publicando: 'Publishing…',
      rechazando: 'Rejecting…',
      publicada: 'Published on the site.',
      rechazada: 'Rejected.',
      errorProcesar: 'Could not process this. Please try again.',
    },
    fr: {
      titulo: 'Avis en attente',
      subtitulo: 'Panneau privé pour vérifier et publier les avis reçus via le formulaire « Partagez votre expérience » de vidavitalqr.com. Approuver ou rejeter ici ne nécessite pas de redéployer le site.',
      lblPassword: 'Mot de passe administrateur',
      btnVer: 'Voir les avis en attente',
      btnActualizar: 'Actualiser la liste',
      escribaPassword: 'Saisissez le mot de passe.',
      passwordIncorrecta: 'Mot de passe incorrect.',
      cargando: 'Chargement…',
      errorCargar: "Impossible de charger la liste. Veuillez réessayer.",
      vacio: "Il n'y a pas d'avis en attente pour le moment.",
      btnAprobar: 'Approuver et publier',
      btnRechazar: 'Rejeter',
      publicando: 'Publication…',
      rechazando: 'Rejet en cours…',
      publicada: 'Publié sur le site.',
      rechazada: 'Rejeté.',
      errorProcesar: 'Le traitement a échoué. Veuillez réessayer.',
    },
    pt: {
      titulo: 'Opiniões pendentes',
      subtitulo: 'Painel privado para revisar e publicar as opiniões recebidas pelo formulário "Compartilhe sua experiência" do vidavitalqr.com. Aprovar ou rejeitar aqui não requer um novo deploy do site.',
      lblPassword: 'Senha de administração',
      btnVer: 'Ver opiniões pendentes',
      btnActualizar: 'Atualizar lista',
      escribaPassword: 'Digite a senha.',
      passwordIncorrecta: 'Senha incorreta.',
      cargando: 'Carregando…',
      errorCargar: 'Não foi possível carregar a lista. Tente novamente.',
      vacio: 'Não há opiniões pendentes no momento.',
      btnAprobar: 'Aprovar e publicar',
      btnRechazar: 'Rejeitar',
      publicando: 'Publicando…',
      rechazando: 'Rejeitando…',
      publicada: 'Publicada no site.',
      rechazada: 'Rejeitada.',
      errorProcesar: 'Não foi possível processar. Tente novamente.',
    },
  };
  var TITULOS_PESTANA = { es: 'Opiniones pendientes — VidaVitalQR', en: 'Pending testimonials — VidaVitalQR', fr: 'Avis en attente — VidaVitalQR', pt: 'Opiniões pendentes — VidaVitalQR' };

  var LANG_PANEL = 'es';
  function T(){ return TEXTOS_PANEL[LANG_PANEL] || TEXTOS_PANEL.es; }

  function aplicarIdiomaPanel(lang){
    if (!TEXTOS_PANEL[lang]) lang = 'es';
    LANG_PANEL = lang;
    document.documentElement.lang = lang;
    document.title = TITULOS_PESTANA[lang] || TITULOS_PESTANA.es;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){
      var key = el.getAttribute('data-i18n');
      if (T()[key] != null) el.textContent = T()[key];
    });
    Array.prototype.forEach.call(document.querySelectorAll('#langbar button'), function(b){
      b.className = (b.getAttribute('data-lang') === lang) ? 'activo' : '';
    });
    try { localStorage.setItem('vidavitalqr_lang', lang); } catch (e) {}
  }

  document.getElementById('langbar').addEventListener('click', function(ev){
    var btn = ev.target.closest('button[data-lang]');
    if (!btn) return;
    aplicarIdiomaPanel(btn.getAttribute('data-lang'));
  });

  (function initIdiomaPanel(){
    var guardado = null;
    try { guardado = localStorage.getItem('vidavitalqr_lang'); } catch (e) {}
    var inicial = guardado && TEXTOS_PANEL[guardado] ? guardado : 'es';
    if (!guardado) {
      try {
        var params = new URLSearchParams(window.location.search);
        var deUrl = params.get('lang');
        if (deUrl && TEXTOS_PANEL[deUrl]) inicial = deUrl;
        else {
          var nav = (navigator.language || '').slice(0, 2).toLowerCase();
          if (TEXTOS_PANEL[nav]) inicial = nav;
        }
      } catch (e) {}
    }
    aplicarIdiomaPanel(inicial);
  })();

  var pw = '';
  var pwInput = document.getElementById('pwInput');
  var btnEntrar = document.getElementById('btnEntrar');
  var loginMsg = document.getElementById('loginMsg');
  var loginBox = document.getElementById('loginBox');
  var listaBox = document.getElementById('listaBox');
  var listaContenido = document.getElementById('listaContenido');
  var btnRefrescar = document.getElementById('btnRefrescar');

  function escapeHtml(s){
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function cargarPendientes(){
    listaContenido.innerHTML = '<p class="empty">' + escapeHtml(T().cargando) + '</p>';
    fetch('/.netlify/functions/list-pending-testimonials', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    })
      .then(function(resp){
        if (resp.status === 401) { throw new Error('unauthorized'); }
        if (!resp.ok) { throw new Error('error'); }
        return resp.json();
      })
      .then(function(data){
        renderLista(data.pendientes || []);
      })
      .catch(function(err){
        if (err && err.message === 'unauthorized') {
          listaBox.hidden = true;
          loginBox.hidden = false;
          loginMsg.textContent = T().passwordIncorrecta;
          loginMsg.className = 'msg err';
        } else {
          listaContenido.innerHTML = '<p class="msg err">' + escapeHtml(T().errorCargar) + '</p>';
        }
      });
  }

  // ---- nota: el nombre, rol, texto y fecha de cada opinión son datos que la propia persona
  // escribió en el formulario público — nunca se traducen, se muestran tal cual se recibieron
  // (igual que los nombres propios y demás texto libre en las fichas). Solo los botones y
  // mensajes de este panel cambian de idioma. ----
  function renderLista(pendientes){
    if (!pendientes.length) {
      listaContenido.innerHTML = '<p class="empty">' + escapeHtml(T().vacio) + '</p>';
      return;
    }
    listaContenido.innerHTML = pendientes.map(function(t){
      return '' +
        '<div class="card" data-id="' + escapeHtml(t.id) + '">' +
          '<div class="testi-name">' + escapeHtml(t.nombre) + '</div>' +
          (t.rol ? '<div class="testi-role">' + escapeHtml(t.rol) + '</div>' : '') +
          '<div class="testi-text">' + escapeHtml(t.texto) + '</div>' +
          '<button class="btn-approve" data-accion="aprobar">' + escapeHtml(T().btnAprobar) + '</button>' +
          '<button class="btn-reject" data-accion="rechazar">' + escapeHtml(T().btnRechazar) + '</button>' +
          '<div class="testi-fecha">' + escapeHtml(t.fecha) + '</div>' +
          '<p class="msg" data-rol="msg"></p>' +
        '</div>';
    }).join('');
  }

  listaContenido.addEventListener('click', function(ev){
    var btn = ev.target.closest('button[data-accion]');
    if (!btn) return;
    var card = btn.closest('.card');
    var id = card.getAttribute('data-id');
    var accion = btn.getAttribute('data-accion');
    var msgEl = card.querySelector('[data-rol="msg"]');

    Array.prototype.forEach.call(card.querySelectorAll('button'), function(b){ b.disabled = true; });
    msgEl.textContent = accion === 'aprobar' ? T().publicando : T().rechazando;
    msgEl.className = 'msg';

    fetch('/.netlify/functions/moderar-testimonial', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, id: id, accion: accion }),
    })
      .then(function(resp){ if (!resp.ok) throw new Error('error'); return resp.json(); })
      .then(function(){
        card.style.opacity = '0.5';
        msgEl.textContent = accion === 'aprobar' ? T().publicada : T().rechazada;
        msgEl.className = 'msg ok';
        setTimeout(function(){ card.remove(); }, 900);
      })
      .catch(function(){
        Array.prototype.forEach.call(card.querySelectorAll('button'), function(b){ b.disabled = false; });
        msgEl.textContent = T().errorProcesar;
        msgEl.className = 'msg err';
      });
  });

  btnEntrar.addEventListener('click', function(){
    pw = pwInput.value || '';
    if (!pw) { loginMsg.textContent = T().escribaPassword; loginMsg.className = 'msg err'; return; }
    loginMsg.textContent = '';
    loginBox.hidden = true;
    listaBox.hidden = false;
    cargarPendientes();
  });

  pwInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') { btnEntrar.click(); }
  });

  btnRefrescar.addEventListener('click', cargarPendientes);
</script>
</body>
</html>
