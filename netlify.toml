[build]
  functions = "netlify/functions"
  publish = "."

# ---- actualizar-tipo-cambio.js: se ejecuta sola una vez al día, sin que nadie la llame, para
# mantener guardado el tipo de cambio (BCCR + 2% de margen) que usan crear-pago.js y tipo-cambio.js
# para el pago en colones. Hora elegida: 15:00 UTC = 9:00 a.m. hora de Costa Rica (UTC-6), ya
# entrado el día hábil en que el BCCR suele publicar su dato. ----
[functions."actualizar-tipo-cambio"]
  schedule = "0 15 * * *"

# ---- revisar-vigencia.js: se ejecuta sola una vez al día (2026-09-25) — revisa la vigencia anual
# de cada ficha, envía los correos de la cronología de avisos (recordatorios de renovación, aviso
# de "vencida", avisos del período de gracia) y elimina por completo lo que ya pasó los 2 meses de
# gracia sin renovar. Hora elegida: 13:00 UTC = 7:00 a.m. hora de Costa Rica (UTC-6), para que los
# correos del día lleguen temprano en la mañana. Ver netlify/functions/lib/vigencia.js y el
# documento "Política de vigencia y eliminación de fichas" del Proyecto ADJDATA. ----
[functions."revisar-vigencia"]
  schedule = "0 13 * * *"

# ---- Rewrite (no redirect: status 200) para acortar la URL pública que se codifica en el QR
# grabado en las placas físicas. El QR llevaba ".netlify/functions/ver?folio=XXXX" (55+ caracteres),
# lo que producía un QR demasiado denso para escanear de forma confiable en placas metálicas
# pequeñas (16-20mm). Con esta regla, "/v/XXXX" sirve exactamente la misma función `ver.js` sin
# cambiar en nada su lógica interna.
#
# 2026-09-29 (primer intento): se cambió de pasar el folio como "?folio=:splat" (querystring) a
# pasarlo como parte de la ruta con un splat ("/:splat", después del nombre de la función). Se
# confirmó en producción que, con el patrón anterior (querystring), el folio llegaba VACÍO a la
# función de forma consistente.
#
# 2026-09-29 (segundo intento — el que quedó, TODAVÍA SIN CONFIRMAR EN PRODUCCIÓN): el splat en la
# ruta TAMPOCO funcionó — probado con una ficha real: "/.netlify/functions/ver/VVITALQR00000118"
# (ruta directa, sin pasar por esta regla) SÍ abre la ficha correctamente, pero
# "/v/VVITALQR00000118" (pasando por esta regla con :splat) seguía dando "Falta el código de la
# ficha". El problema no está en ver.js — está en esta regla específica de reescritura. Se cambió
# de splat (*) a un marcador con nombre (:folio), que es exactamente el mismo formato que aparece
# como ejemplo en la documentación/base de conocimiento oficial de Netlify para este caso puntual
# (nombre fijo de función + un solo valor dinámico capturado). También se agregó "force = true":
# por defecto, Netlify NO aplica una regla de reescritura si existe un archivo real con ese mismo
# nombre en el sitio (aunque se confirmó que no hay ningún archivo llamado "v" en la raíz del
# repositorio, así que esto es una protección de más, no la causa del problema). Si con estos 2
# cambios TAMPOCO funciona, el siguiente paso sería escribir directamente al soporte de Netlify. ----
[[redirects]]
  from = "/v/:folio"
  to = "/.netlify/functions/ver/:folio"
  status = 200
  force = true

# ---- Rewrite para la página "Mi código QR" del producto "Código QR (solo digital)" (2026-10-02,
# ver netlify/functions/qr-digital.js). Mismo patrón ya probado y funcionando en producción que la
# regla de "/v/:folio" de arriba — el folio se lee del final de la ruta, no de un querystring. ----
[[redirects]]
  from = "/qr/:folio"
  to = "/.netlify/functions/qr-digital/:folio"
  status = 200
  force = true
