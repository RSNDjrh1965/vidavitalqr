[build]
  functions = "netlify/functions"
  publish = "."

# ---- actualizar-tipo-cambio.js: se ejecuta sola una vez al día, sin que nadie la llame, para
# mantener guardado el tipo de cambio (BCCR + 2% de margen) que usan crear-pago.js y tipo-cambio.js
# para el pago en colones. Hora elegida: 15:00 UTC = 9:00 a.m. hora de Costa Rica (UTC-6), ya
# entrado el día hábil en que el BCCR suele publicar su dato. ----
[functions."actualizar-tipo-cambio"]
  schedule = "0 15 * * *"

# ---- revisar-vigencia.js: se ejecuta sola una vez al día (2026-09-25) — revisa la vigencia anual
# de cada ficha, envía los correos de la cronología de avisos (recordatorios de renovación, aviso
# de "vencida", avisos del período de gracia) y elimina por completo lo que ya pasó los 2 meses de
# gracia sin renovar. Hora elegida: 13:00 UTC = 7:00 a.m. hora de Costa Rica (UTC-6), para que los
# correos del día lleguen temprano en la mañana. Ver netlify/functions/lib/vigencia.js y el
# documento "Política de vigencia y eliminación de fichas" del Proyecto ADJDATA. ----
[functions."revisar-vigencia"]
  schedule = "0 13 * * *"

# ---- Rewrite (no redirect: status 200) para acortar la URL pública que se codifica en el QR
# grabado en las placas físicas. El QR llevaba ".netlify/functions/ver?folio=XXXX" (55+ caracteres),
# lo que producía un QR demasiado denso para escanear de forma confiable en placas metálicas
# pequeñas (16-20mm). Con esta regla, "/v/XXXX" sirve exactamente la misma función `ver.js` sin
# cambiar en nada su lógica interna.
#
# 2026-09-29: se cambió de pasar el folio como "?folio=:splat" (querystring) a pasarlo como parte
# de la ruta ("/:splat", después del nombre de la función). Se confirmó en producción que, con el
# patrón anterior, el folio llegaba VACÍO a la función de forma consistente (confirmado con
# pruebas reales, no solo en teoría) — un problema conocido de Netlify con ese patrón específico
# de reescritura hacia funciones. Pasarlo en la ruta es el patrón más confiable, y ver.js ya se
# actualizó para leerlo así (con el formato anterior como respaldo). ----
[[redirects]]
  from = "/v/*"
  to = "/.netlify/functions/ver/:splat"
  status = 200
